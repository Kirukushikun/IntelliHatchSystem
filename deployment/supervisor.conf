; Supervisor configuration for IntelliHatch (IHS)
; Place this file at: /etc/supervisor/conf.d/intellihatch.conf
; Then run: supervisorctl reread && supervisorctl update

; ─── Queue Worker ────────────────────────────────────────────────────────────
[program:intellihatch-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/intellihatch/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
directory=/var/www/intellihatch
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/intellihatch-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=3600

; ─── Laravel Horizon (optional — uncomment if you add Horizon later) ─────────
; [program:intellihatch-horizon]
; process_name=%(program_name)s
; command=php /var/www/intellihatch/artisan horizon
; directory=/var/www/intellihatch
; autostart=true
; autorestart=true
; user=www-data
; redirect_stderr=true
; stdout_logfile=/var/log/supervisor/intellihatch-horizon.log
; stdout_logfile_maxbytes=10MB
; stopwaitsecs=3600
