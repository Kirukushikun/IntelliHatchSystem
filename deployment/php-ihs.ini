; PHP overrides for IntelliHatch (IHS)
; Installed by deployment/deploy.sh into /etc/php/8.4/{fpm,cli}/conf.d/99-ihs.ini
;
; Photo uploads accept up to 10MB each (TempPhotoManager), Livewire allows 50MB
; per temporary upload, and nginx allows 64M request bodies (nginx.conf) —
; keep these in step with client_max_body_size.
upload_max_filesize = 64M
post_max_size       = 64M
max_execution_time  = 300
memory_limit        = 256M
