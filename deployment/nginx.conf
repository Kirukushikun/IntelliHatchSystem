server {
    listen 80;
    server_name _;

    root /var/www/intellihatch/public;
    index index.php;

    # Max upload size (adjust to match your php.ini)
    client_max_body_size 64M;

    # Logging
    access_log /var/log/nginx/intellihatch.access.log;
    error_log  /var/log/nginx/intellihatch.error.log;

    # Cloudflared / reverse-proxy headers
    # The app already calls trustProxies(at: '*') so these pass through fine.
    set_real_ip_from 127.0.0.1;
    real_ip_header   CF-Connecting-IP;

    # Security headers
    add_header X-Frame-Options           "SAMEORIGIN"   always;
    add_header X-Content-Type-Options    "nosniff"      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # Livewire JS/CSS routes — must reach PHP, not be served as static files
    location ~* ^/livewire-[^/]+/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Static assets — long cache, no PHP
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Main entry-point
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM
    location ~ \.php$ {
        include        snippets/fastcgi-php.conf;
        fastcgi_pass   unix:/run/php/php8.4-fpm.sock;

        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;

        # Pass Cloudflare headers to PHP
        fastcgi_param  HTTP_CF_CONNECTING_IP $http_cf_connecting_ip;
        fastcgi_param  HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;

        # Timeouts for long-running requests (e.g. uploads)
        fastcgi_read_timeout 300;
    }

    # Block dot-files
    location ~ /\.(?!well-known) {
        deny all;
    }
}
